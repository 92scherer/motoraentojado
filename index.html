<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movexa - Gestão de Escala de Rotas</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --border-color: #222222;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #ffffff;
            --accent-hover: #dddddd;
            --danger-color: #ff4444;
            --success-color: #00C851;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 30px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        .logo-img {
            max-width: 150px;
            height: auto;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .system-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 22px;
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-left: 3px solid #ffffff;
            padding-left: 12px;
        }

        /* Menu Principal */
        .menu-grid {
            display: grid;
            gap: 16px;
            margin-top: 20px;
        }

        .menu-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn:hover {
            border-color: #ffffff;
            background-color: #161616;
            transform: translateX(4px);
        }

        .menu-btn span {
            font-size: 20px;
            color: var(--text-secondary);
        }

        .menu-btn:hover span {
            color: #ffffff;
        }

        /* Formulários e Inputs */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #ffffff;
        }

        /* Botões de Ação */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            background-color: #111111;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid #441111;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
        }

        .btn-danger:hover {
            background-color: #220000;
        }

        /* Tabelas e Listas */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0a0a0a;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #080808;
        }

        .route-input {
            width: 100px;
            padding: 8px 10px;
            text-align: center;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-available {
            background-color: rgba(0, 200, 81, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(0, 200, 81, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 24px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
            background-color: var(--bg-color);
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .btn-group {
                flex-direction: column-reverse;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpeg" alt="Logo Movexa" class="logo-img">
        <div class="system-subtitle">Controle de Escala de Rotas</div>
    </header>

    <main>
        <!-- TELA 1: MENU PRINCIPAL -->
        <div id="screen-home" class="screen active">
            <h2>Menu Principal</h2>
            <div class="menu-grid">
                <button class="menu-btn" onclick="navigateTo('screen-cadastro')">
                    Cadastro de motoristas <span>&rarr;</span>
                </button>
                <button class="menu-btn" onclick="navigateTo('screen-roteirizar')">
                    Roteirizar motoristas <span>&rarr;</span>
                </button>
                <button class="menu-btn" onclick="navigateTo('screen-disponiveis')">
                    Motoristas disponíveis <span>&rarr;</span>
                </button>
            </div>
        </div>

        <!-- TELA 2: CADASTRO DE MOTORISTAS -->
        <div id="screen-cadastro" class="screen">
            <h2>Cadastro de Motoristas</h2>
            <form id="form-driver" onsubmit="saveDriver(event)">
                <div class="form-group">
                    <label for="driver-name">Nome do Motorista</label>
                    <input type="text" id="driver-name" required placeholder="Ex: Carlos Silva">
                </div>
                <div class="form-group">
                    <label for="driver-plate">Placa do Veículo</label>
                    <input type="text" id="driver-plate" required placeholder="Ex: ABC-1234">
                </div>
                <div class="form-group">
                    <label for="driver-type">Tipo de Veículo</label>
                    <input type="text" id="driver-type" required placeholder="Ex: VUC / 3/4 / Toco">
                </div>
                <div class="form-group">
                    <label for="driver-boxes">Quantidade Média de Caixas</label>
                    <input type="number" id="driver-boxes" required min="0" placeholder="Ex: 450">
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="navigateTo('screen-home')">Voltar</button>
                    <button type="submit" class="btn btn-primary">Salvar Motorista</button>
                </div>
            </form>

            <div style="margin-top: 40px;">
                <h3 style="font-size: 16px; margin-bottom: 12px; color: var(--text-secondary);">Motoristas Cadastrados</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Placa</th>
                                <th>Tipo</th>
                                <th>Média Caixas</th>
                                <th style="text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="drivers-table-body">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TELA 3: ROTEIRIZAR MOTORISTAS -->
        <div id="screen-roteirizar" class="screen">
            <h2>Roteirizar Motoristas</h2>
            <div class="form-group">
                <label for="route-date">Data da Roteirização (Dia de Montagem da Escala)</label>
                <input type="date" id="route-date" onchange="loadRouteData()">
            </div>

            <div class="table-responsive" style="margin-top: 20px;">
                <table>
                    <thead>
                        <tr>
                            <th>Motorista</th>
                            <th>Placa / Tipo</th>
                            <th>Média Caixas</th>
                            <th style="width: 140px;">Nº da Rota</th>
                        </tr>
                    </thead>
                    <tbody id="routing-table-body">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="navigateTo('screen-home')">Voltar à Tela Inicial</button>
                <button type="button" class="btn btn-primary" onclick="saveRoutes()">Salvar Escala</button>
            </div>
        </div>

        <!-- TELA 4: MOTORISTAS DISPONÍVEIS -->
        <div id="screen-disponiveis" class="screen">
            <h2>Motoristas Disponíveis</h2>
            <div class="form-group">
                <label for="check-date">Data das Entregas (Hoje):</label>
                <input type="date" id="check-date" onchange="loadAvailableDrivers()">
            </div>

            <p id="info-date-ref" style="font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; font-style: italic;">
                <!-- Exibe dinamicamente qual data de roteirização foi verificada -->
            </p>

            <div class="table-responsive" style="margin-top: 10px;">
                <table>
                    <thead>
                        <tr>
                            <th>Motorista</th>
                            <th>Placa</th>
                            <th>Tipo</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="available-table-body">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="btn-group" style="margin-top: 30px;">
                <button type="button" class="btn btn-secondary" onclick="navigateTo('screen-home')">Voltar à Tela Inicial</button>
            </div>
        </div>
    </main>

    <footer>
        Desenvolvido por Movexa Gestão Logística
    </footer>

    <script>
        function getDrivers() {
            let drivers = localStorage.getItem('movexa_drivers');
            return drivers ? JSON.parse(drivers) : [];
        }

        function getSchedules() {
            let schedules = localStorage.getItem('movexa_schedules');
            return schedules ? JSON.parse(schedules) : {};
        }

        // Navegação entre telas
        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);

            if (screenId === 'screen-cadastro') {
                renderDriversTable();
            } else if (screenId === 'screen-roteirizar') {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('route-date').value = today;
                loadRouteData();
            } else if (screenId === 'screen-disponiveis') {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('check-date').value = today;
                loadAvailableDrivers();
            }
        }

        // Cadastro de Motoristas
        function saveDriver(event) {
            event.preventDefault();
            const name = document.getElementById('driver-name').value;
            const plate = document.getElementById('driver-plate').value;
            const type = document.getElementById('driver-type').value;
            const boxes = document.getElementById('driver-boxes').value;

            const drivers = getDrivers();
            drivers.push({
                id: Date.now(),
                name,
                plate: plate.toUpperCase(),
                type,
                boxes: Number(boxes)
            });

            localStorage.setItem('movexa_drivers', JSON.stringify(drivers));
            document.getElementById('form-driver').reset();
            renderDriversTable();
            alert('Motorista cadastrado com sucesso!');
        }

        function deleteDriver(id) {
            if (confirm('Deseja realmente excluir este motorista?')) {
                let drivers = getDrivers();
                drivers = drivers.filter(d => d.id !== id);
                localStorage.setItem('movexa_drivers', JSON.stringify(drivers));
                renderDriversTable();
            }
        }

        function renderDriversTable() {
            const drivers = getDrivers();
            const tbody = document.
